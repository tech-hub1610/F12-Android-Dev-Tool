plugins {
    id 'com.android.application'
}

android {
    namespace 'com.f12.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.f12.browser"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "f12browser"
            keyAlias "f12release"
            keyPassword "f12browser"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "F12-Browser-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    testImplementation 'junit:junit:4.13.2'
}

tasks.register('copyApkToOutput', Copy) {
    from layout.buildDirectory.dir("outputs/apk")
    include "**/*.apk"
    into "${rootDir}/output"
    eachFile { path = name }
    includeEmptyDirs = false
}

afterEvaluate {
    tasks.named('assembleDebug').configure {
        finalizedBy 'copyApkToOutput'
    }
    tasks.named('assembleRelease').configure {
        finalizedBy 'copyApkToOutput'
    }
}
